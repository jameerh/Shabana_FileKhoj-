name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configure persistent APK signing
        id: signing
        shell: bash
        run: |
          if [[ -z "$ANDROID_SIGNING_KEYSTORE_BASE64" ||
                -z "$ANDROID_SIGNING_KEYSTORE_PASSWORD" ||
                -z "$ANDROID_SIGNING_KEY_ALIAS" ||
                -z "$ANDROID_SIGNING_KEY_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Persistent signing secrets are not configured. CI will run tests, but will not publish an APK that could break in-place updates."
            exit 0
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/shabana-filekhoj-signing.jks"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_SIGNING_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        run: gradle assembleRelease

      - name: Run unit tests
        run: gradle test

      - name: Upload consistently signed APKs
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Shabana-FileKhoj-update-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          script: |
            set -uo pipefail
            mkdir -p app/build/ci-diagnostics

            echo "Waiting for Android boot completion..."
            adb wait-for-device
            boot_deadline=$((SECONDS + 600))
            until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r')" == "1" ]]; do
              if (( SECONDS >= boot_deadline )); then
                echo "::error::Android emulator did not complete boot within 600 seconds."
                adb shell getprop > app/build/ci-diagnostics/getprop-timeout.txt 2>&1 || true
                adb shell dumpsys -l > app/build/ci-diagnostics/services-timeout.txt 2>&1 || true
                adb logcat -d -v threadtime > app/build/ci-diagnostics/logcat-timeout.txt 2>&1 || true
                exit 1
              fi
              sleep 5
            done

            echo "Waiting for PackageManager and ActivityManager services..."
            service_deadline=$((SECONDS + 300))
            services_ready=false
            while (( SECONDS < service_deadline )); do
              package_ready=false
              activity_ready=false
              if adb shell cmd package list packages >/dev/null 2>&1; then
                package_ready=true
              fi
              if adb shell dumpsys activity services >/dev/null 2>&1; then
                activity_ready=true
              fi
              if [[ "$package_ready" == "true" && "$activity_ready" == "true" ]]; then
                services_ready=true
                break
              fi
              sleep 5
            done

            if [[ "$services_ready" != "true" ]]; then
              echo "::error::Android package/activity services did not become responsive."
              adb shell getprop > app/build/ci-diagnostics/getprop-service-timeout.txt 2>&1 || true
              adb shell dumpsys -l > app/build/ci-diagnostics/services-service-timeout.txt 2>&1 || true
              adb logcat -d -v threadtime > app/build/ci-diagnostics/logcat-service-timeout.txt 2>&1 || true
              exit 1
            fi

            echo "Android boot and core package services are ready."
            if gradle connectedDebugAndroidTest; then
              test_status=0
            else
              test_status=$?
            fi

            adb logcat -d -v threadtime > app/build/ci-diagnostics/logcat.txt 2>&1 || true
            adb shell dumpsys activity processes > app/build/ci-diagnostics/activity-processes.txt 2>&1 || true
            adb shell dumpsys package > app/build/ci-diagnostics/package-manager.txt 2>&1 || true
            exit "$test_status"

      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/ci-diagnostics/
            app/build/reports/androidTests/connected/debug/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7
